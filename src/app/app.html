@if (mostrarNavbar()) {
  <app-navbar></app-navbar>
}

<main class="main-content">
  <router-outlet />
</main>

<!-- OVERLAY GLOBAL DE CARGA DE MERCADO PAGO -->
@if (reservaService.cargandoPago()) {
  <div class="fixed inset-0 bg-slate-900/75 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl border border-slate-100 flex flex-col items-center animate-fade-in">

      <!-- Spinner animado azul Mercado Pago -->
      <div class="w-12 h-12 border-4 border-slate-200 border-t-[#009ee3] rounded-full animate-spin mb-4"></div>

      <h3 class="text-lg font-bold text-slate-800 mb-1">Conectando con Mercado Pago...</h3>
      <p class="text-xs text-slate-500 leading-relaxed">
        Por favor aguardá unos segundos sin cerrar ni refrescar la pantalla mientras te redirigimos a la pasarela de pago.
      </p>
    </div>
  </div>
}
