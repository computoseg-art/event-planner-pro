<div class="login-container">
  <div class="login-card">
    <h2>{{ esRegistro() ? 'Crear Cuenta' : 'Iniciar Sesión' }}</h2>

    <div class="form-group">
      <label>Correo Electrónico</label>
      <input
        type="email"
        [ngModel]="nombreUsuario()"
        (input)="nombreUsuario.set($any($event.target).value)"
        placeholder="ejemplo@correo.com"
        class="login-input"
      />
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input
        type="password"
        [ngModel]="passwordUsuario()"
        (input)="passwordUsuario.set($any($event.target).value)"
        placeholder="Mínimo 6 caracteres"
        class="login-input"
      />
    </div>

    <button
      (click)="accionPrincipal()"
      class="btn-primary"
      [disabled]="nombreUsuario().trim().length === 0 || passwordUsuario().trim().length < 6"
    >
      {{ esRegistro() ? 'Registrarse Ahora' : 'Entrar' }}
    </button>

    <!-- Botón de Inicio de Sesión con Google -->
    <div class="social-login-container">
      <div class="divider-text">
        <span>o continúa con</span>
      </div>

      <button type="button" class="btn-google" (click)="ingresarConGoogle()">
        <svg class="google-icon" width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.617z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        Google
      </button>
    </div>

    <p (click)="esRegistro.set(!esRegistro())" class="toggle-link">
      {{
        esRegistro()
          ? '¿Ya tienes cuenta? Inicia sesión aquí'
          : '¿No tienes cuenta? Regístrate gratis'
      }}
    </p>
  </div>
</div>
