<main>
  <h1>Contacto</h1>
  <p class="contact-intro">
    Contanos qué estás imaginando. Nos encantará ayudarte a crear un día inolvidable.
  </p>
  <form (ngSubmit)="enviarFormulario()" #miForm="ngForm">
    <div class="form-group">
      <label for="contact-name">Tu nombre</label>
      <input
        id="contact-name"
        type="text"
        [ngModel]="nombre()"
        (input)="nombre.set($any($event.target).value)"
        name="nombre"
        maxlength="100"
        required
        placeholder="Tu nombre"
        autocomplete="name"
      />
    </div>

    <div class="form-group">
      <label for="contact-email">Correo electrónico</label>
      <input
        id="contact-email"
        type="email"
        [ngModel]="email()"
        (input)="email.set($any($event.target).value)"
        name="email"
        maxlength="254"
        required
        placeholder="ejemplo@correo.com"
        autocomplete="email"
      />
    </div>

    <div class="form-group">
      <label for="contact-message">¿En qué podemos ayudarte?</label>
      <textarea
        id="contact-message"
        [ngModel]="mensaje()"
        (input)="mensaje.set($any($event.target).value)"
        name="mensaje"
        maxlength="5000"
        required
        placeholder="Contanos qué evento estás organizando..."
        rows="4"
      ></textarea>
    </div>

    <button type="submit" [disabled]="!miForm.valid">Enviar mensaje</button>
  </form>
</main>
