<main>
  <h1>Contacto</h1>
  <p class="contact-intro">
    Contanos qué estás imaginando. Nos encantará ayudarte a crear un día inolvidable.
  </p>
  <div class="contact-options" aria-label="Opciones de contacto directo">
    <a href="mailto:esteban.garriga@gmail.com">
      <span class="contact-option-label">Escribinos por email</span>
      <strong>esteban.garriga@gmail.com</strong>
    </a>
    <a
      class="whatsapp-contact"
      href="https://wa.me/59897403118"
      target="_blank"
      rel="noopener noreferrer">
      <svg
        class="whatsapp-icon"
        viewBox="0 0 32 32"
        role="img"
        aria-label="WhatsApp">
        <path
          d="M16 3a12.9 12.9 0 0 0-11 19.6L3.3 29l6.6-1.7A13 13 0 1 0 16 3Z"
          fill="currentColor" />
        <path
          d="M22.5 19.1c-.35-.18-2.07-1.02-2.39-1.14-.32-.12-.55-.18-.78.18-.23.35-.9 1.14-1.1 1.38-.2.23-.4.26-.75.09-.35-.18-1.47-.54-2.8-1.72-1.03-.91-1.73-2.04-1.93-2.39-.2-.35-.02-.54.15-.71.16-.15.35-.41.53-.62.18-.2.23-.35.35-.58.12-.23.06-.44-.03-.62-.09-.18-.78-1.88-1.07-2.58-.28-.67-.56-.58-.78-.59h-.67c-.23 0-.61.09-.93.44-.32.35-1.22 1.2-1.22 2.92s1.25 3.39 1.42 3.62c.18.23 2.46 3.76 5.96 5.27.83.36 1.48.57 1.98.73.83.26 1.59.22 2.19.13.67-.1 2.07-.85 2.36-1.67.29-.82.29-1.52.2-1.67-.09-.15-.32-.23-.67-.41Z"
          fill="#fff" />
      </svg>
      <span>
        <span class="contact-option-label">Contactanos por WhatsApp</span>
        <strong>+598 97 403 118</strong>
      </span>
    </a>
  </div>
  <form (ngSubmit)="enviarFormulario()" #miForm="ngForm">
    <div class="form-group">
      <input
        type="text"
        [ngModel]="nombre()"
        (input)="nombre.set($any($event.target).value)"
        name="nombre"
        maxlength="100"
        required
        placeholder="Tu nombre"
        aria-label="Tu nombre"
      />
    </div>

    <div class="form-group">
      <input
        type="email"
        [ngModel]="email()"
        (input)="email.set($any($event.target).value)"
        name="email"
        maxlength="254"
        required
        placeholder="ejemplo@correo.com"
        aria-label="Tu correo electrónico"
      />
    </div>

    <div class="form-group">
      <textarea
        [ngModel]="mensaje()"
        (input)="mensaje.set($any($event.target).value)"
        name="mensaje"
        maxlength="5000"
        required
        placeholder="Escribe tu mensaje..."
        rows="4"
        aria-label="Tu mensaje"
      ></textarea>
    </div>

    <button type="submit" [disabled]="!miForm.valid || enviando()">
      {{ enviando() ? 'Enviando…' : 'Enviar mensaje' }}
    </button>
    @if (estadoEnvio()) {
      <p
        class="contact-status"
        [class.contact-error]="errorEnvio()"
        role="status"
        aria-live="polite">
        {{ estadoEnvio() }}
      </p>
    }
  </form>
</main>
