<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Agenda</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Pre-conectores para acelerar la resolución de DNS y Handshake SSL de Mercado Pago -->
    <link rel="preconnect" href="https://www.mercadopago.com" />
    <link rel="preconnect" href="https://api.mercadopago.com" />
    <link rel="preconnect" href="https://sdk.mercadopago.com" />
    <link rel="dns-prefetch" href="https://www.mercadopago.com" />

    <!-- Directiva Content Security Policy ajustada para permitir los scripts e iframe de Mercado Pago -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self' data: gap: https: 'unsafe-inline' 'unsafe-eval';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.mercadopago.com https://*.mercadolibre.com https://sdk.mercadopago.com;
      connect-src 'self' https: https://*.mercadopago.com https://*.mercadolibre.com https://*.firebaseio.com https://*.googleapis.com;
      frame-src 'self' https://*.mercadopago.com https://*.mercadolibre.com;
      img-src 'self' data: https:;
      style-src 'self' 'unsafe-inline' https:;
    ">

    <!-- SDK oficial de Mercado Pago -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
